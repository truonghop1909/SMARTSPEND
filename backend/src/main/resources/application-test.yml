spring:
  datasource:
    url: jdbc:mysql://localhost:3307/smartspend_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8
    username: smartspend
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

app:
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LXRoYXQtaXMtYXQtbGVhc3QtMzItYnl0ZXM=
    access-token-expiration: 15m
    refresh-token-expiration: 30d

  cors:
    allowed-origins: http://localhost:3000

  security:
    login:
      max-attempts: 5
      window: 1m